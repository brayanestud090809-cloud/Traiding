<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LTC Trading & Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 12px 12px 70px 12px;
            min-height: 100vh;
        }

        /* Balance global */
        .global-balance {
            background: #1e293b;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .bal-title { font-size: 0.75em; color: #94a3b8; text-transform: uppercase; }
        .bal-val { font-size: 1.1em; font-weight: bold; color: #38bdf8; margin-top: 2px; }

        /* Pestañas (Tabs) */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Navegación Inferior */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            display: flex;
            border-top: 1px solid #334155;
            z-index: 100;
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-btn.active { color: #38bdf8; border-top: 2px solid #38bdf8; }

        /* Componentes de Trading */
        .card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        h3 { margin: 0 0 10px 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        button.action-btn { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-buy { background: #10b981; }
        .btn-sell { background: #ef4444; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 8px; }
        #chart-container { height: 260px; width: 100%; border-radius: 8px; overflow: hidden; }

        /* Componentes de Minería */
        .click-area { position: relative; margin: 15px 0; display: flex; justify-content: center; }
        .miner-btn {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle, #0284c7 0%, #0369a1 100%);
            border: 5px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            display: flex; justify-content: center; align-items: center;
            font-size: 60px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .miner-btn:active { transform: scale(0.93); }
        .floating-text { position: absolute; font-size: 1.2em; font-weight: bold; color: #38bdf8; pointer-events: none; animation: floatUp 0.8s forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        .progress-bar { width: 100%; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #f59e0b; width: 100%; }

        .item-card { background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- SALDO GLOBAL -->
    <div class="global-balance">
        <div>
            <div class="bal-title">Saldo USD</div>
            <div class="bal-val" id="usd-balance">$1,000.00</div>
        </div>
        <div>
            <div class="bal-title">Saldo LTC</div>
            <div class="bal-val" id="ltc-balance">0.00000000</div>
        </div>
    </div>

    <!-- PESTAÑA 1: TRADING -->
    <div id="tab-trading" class="tab-content active">
        <div class="card" style="padding: 0;">
            <div id="chart-container">
                <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_1&symbol=BINANCE%3ALTCUSDT&interval=D&hidesidetoolbar=1&symboledit=0&saveimage=0&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC" 
                        width="100%" height="100%" frameborder="0" allowtransparency="true" scrolling="no"></iframe>
            </div>
        </div>

        <div class="card">
            <h3>Operar Mercado LTC</h3>
            <input type="number" id="trade-amount" placeholder="Cantidad de LTC (ej. 0.5)" step="0.01">
            <div class="btn-group">
                <button class="action-btn btn-buy" onclick="executeTrade('buy')">Comprar</button>
                <button class="action-btn btn-sell" onclick="executeTrade('sell')">Vender</button>
            </div>
        </div>

        <div class="card">
            <h3>Transferencia Directa</h3>
            <input type="text" id="transfer-address" placeholder="Dirección de destino">
            <input type="number" id="transfer-amount" placeholder="Cantidad de LTC" step="0.01">
            <button class="action-btn" style="background: #0284c7; width: 100%;" onclick="transferLtc()">Enviar LTC</button>
        </div>
    </div>

    <!-- PESTAÑA 2: MINERÍA -->
    <div id="tab-mining" class="tab-content">
        <div class="card" style="text-align: center;">
            <div style="font-size: 0.85em; color: #94a3b8;">Velocidad actual</div>
            <div style="font-size: 1.4em; font-weight: bold; color: #38bdf8;"><span id="hashrate">0</span> GH/s</div>
        </div>

        <div class="click-area" id="click-area">
            <div class="miner-btn" id="miner-btn">⛏️</div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; font-size: 0.8em; margin-bottom: 5px;">
                <span>⚡ Energía</span>
                <span id="energy-text">1000 / 1000</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="energy-fill"></div>
            </div>
        </div>

        <div class="card">
            <h3>🛒 Hardware de Minería</h3>
            <div class="item-card">
                <div>
                    <div style="font-weight: bold;">GPU Rig</div>
                    <div style="font-size: 0.75em; color: #38bdf8;">+0.00000002 LTC/s</div>
                </div>
                <button class="action-btn" style="background: #10b981; padding: 6px 10px;" id="buy-gpu" onclick="buyUpgrade('gpu')">
                    <span id="gpu-cost">0.00000500</span> LTC
                </button>
            </div>
            <div class="item-card">
                <div>
                    <div style="font-weight: bold;">ASIC Pro</div>
                    <div style="font-size: 0.75em; color: #38bdf8;">+0.00000010 LTC/s</div>
                </div>
                <button class="action-btn" style="background: #10b981; padding: 6px 10px;" id="buy-asic" onclick="buyUpgrade('asic')">
                    <span id="asic-cost">0.00002500</span> LTC
                </button>
            </div>
        </div>
    </div>

    <!-- BARRA NAVEGACIÓN -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('trading', this)">
            <span>📈</span> Trading
        </button>
        <button class="nav-btn" onclick="switchTab('mining', this)">
            <span>⛏️</span> Minería
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Estado global de la App
        let state = JSON.parse(localStorage.getItem('ltc_combined_data')) || {
            usdBalance: 1000.00,
            ltcBalance: 0.00000000,
            energy: 1000,
            maxEnergy: 1000,
            hashrate: 0,
            passiveRate: 0,
            gpuCost: 0.00000500,
            asicCost: 0.00002500
        };

        let ltcPrice = 75.00;

        function saveData() {
            localStorage.setItem('ltc_combined_data', JSON.stringify(state));
        }

        function updateUI() {
            document.getElementById('usd-balance').innerText = `$${state.usdBalance.toFixed(2)}`;
            document.getElementById('ltc-balance').innerText = state.ltcBalance.toFixed(8);
            
            // Minería
            document.getElementById('hashrate').innerText = state.hashrate;
            document.getElementById('energy-text').innerText = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
            document.getElementById('energy-fill').style.width = `${(state.energy / state.maxEnergy) * 100}%`;
            
            document.getElementById('gpu-cost').innerText = state.gpuCost.toFixed(8);
            document.getElementById('asic-cost').innerText = state.asicCost.toFixed(8);

            document.getElementById('buy-gpu').disabled = state.ltcBalance < state.gpuCost;
            document.getElementById('buy-asic').disabled = state.ltcBalance < state.asicCost;
        }

        // Cambio de Pestañas
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btn.classList.add('active');
        }

        // Lógica de Trading
        async function fetchPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=litecoin&vs_currencies=usd');
                const data = await res.json();
                ltcPrice = data.litecoin.usd;
            } catch (e) { console.log("Precio base $75"); }
        }

        function executeTrade(type) {
            const amount = parseFloat(document.getElementById('trade-amount').value);
            if (!amount || amount <= 0) return alert("Ingresa un monto válido.");

            const cost = amount * ltcPrice;

            if (type === 'buy') {
                if (state.usdBalance >= cost) {
                    state.usdBalance -= cost;
                    state.ltcBalance += amount;
                    alert(`Compra exitosa: ${amount} LTC`);
                } else alert("Saldo insuficiente en USD.");
            } else {
                if (state.ltcBalance >= amount) {
                    state.ltcBalance -= amount;
                    state.usdBalance += cost;
                    alert(`Venta exitosa: ${amount} LTC por $${cost.toFixed(2)} USD`);
                } else alert("Saldo insuficiente en LTC.");
            }
            updateUI();
            saveData();
        }

        function transferLtc() {
            const address = document.getElementById('transfer-address').value;
            const amount = parseFloat(document.getElementById('transfer-amount').value);

            if (!address) return alert("Ingresa una dirección.");
            if (!amount || amount <= 0) return alert("Monto inválido.");

            if (state.ltcBalance >= amount) {
                state.ltcBalance -= amount;
                alert(`Transferencia enviada:\n${amount} LTC a ${address}`);
                updateUI();
                saveData();
            } else alert("Saldo LTC insuficiente.");
        }

        // Lógica de Minería
        const minerBtn = document.getElementById('miner-btn');
        const clickArea = document.getElementById('click-area');

        minerBtn.addEventListener('click', (e) => {
            if (state.energy >= 1) {
                state.energy -= 1;
                state.ltcBalance += 0.00000005;

                const floatEl = document.createElement('div');
                floatEl.className = 'floating-text';
                floatEl.innerText = '+0.00000005';
                floatEl.style.left = `${e.clientX - clickArea.getBoundingClientRect().left - 20}px`;
                floatEl.style.top = `${e.clientY - clickArea.getBoundingClientRect().top - 10}px`;
                clickArea.appendChild(floatEl);

                setTimeout(() => floatEl.remove(), 800);
                updateUI();
                saveData();
            }
        });

        function buyUpgrade(type) {
            if (type === 'gpu' && state.ltcBalance >= state.gpuCost) {
                state.ltcBalance -= state.gpuCost;
                state.hashrate += 15;
                state.passiveRate += 0.00000002;
                state.gpuCost *= 1.4;
            } else if (type === 'asic' && state.ltcBalance >= state.asicCost) {
                state.ltcBalance -= state.asicCost;
                state.hashrate += 80;
                state.passiveRate += 0.00000010;
                state.asicCost *= 1.5;
            }
            updateUI();
            saveData();
        }

        // Bucle en segundo plano (minado pasivo + recarga energía)
        setInterval(() => {
            if (state.passiveRate > 0) state.ltcBalance += state.passiveRate;
            if (state.energy < state.maxEnergy) state.energy = Math.min(state.maxEnergy, state.energy + 3);
            updateUI();
            saveData();
        }, 1000);

        fetchPrice();
        setInterval(fetchPrice, 15000);
        updateUI();
    </script>
</body>
</html>
